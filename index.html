];
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function dayIndex(){ var n=new Date(); n.setHours(0,0,0,0); var l=new Date(LAUNCH); l.setHours(0,0,0,0); return Math.max(0, Math.floor((n-l)/86400000)); }
function loadArch(){ try{ var s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):[]; }catch(e){ return window._memArch||(window._memArch=[]); } }
function saveArch(a){ try{ localStorage.setItem(LS_KEY, JSON.stringify(a)); }catch(e){ window._memArch=a; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var view=document.getElementById("view");
var playState=null;
function scoreQuiz(qi, answers){ var q=QUIZZES[qi], tally={}; q.order.forEach(function(k){ tally[k]=0; }); answers.forEach(function(a,i){ var qu=q.questions[i], key=null; if(qu.t==="c"){ key=qu.o[a].k; } else { key=(a<50)?qu.mk:qu.xk; } tally[key]=(tally[key]||0)+1; }); var best=q.order[0], bestScore=-1; q.order.forEach(function(k){ if(tally[k]>bestScore){ bestScore=tally[k]; best=k; } }); return best; }
function answerLabel(qi, i, a){ var qu=QUIZZES[qi].questions[i]; if(qu.t==="c") return qu.o[a].l; return "滑动 "+a+"（"+(a<50?qu.min:qu.max)+"）"; }
function renderHome(){ var qi=dayIndex()%QUIZZES.length, t=todayStr(), arch=loadArch(); var done=null; arch.forEach(function(e){ if(e.qi===qi&&e.d===t) done=e; }); if(done){ var q=QUIZZES[qi], r=q.results[done.k]; view.innerHTML='<div class="result-card" style="--accent:'+r.c+'">'+'<div class="result-tag">'+esc(q.title)+'</div>'+'<div class="result-name">'+esc(r.n)+'</div>'+'<div class="result-blurb">'+esc(r.d)+'</div>'+'<div class="result-date">'+t+' 的测试已完成</div></div>'+'<div class="done-note">明天的新测试见</div>'+'<button class="btn btn-ghost" onclick="renderArchive()">看看我的档案馆</button>'; }else{ var q2=QUIZZES[qi]; view.innerHTML='<div class="card"><div class="quiz-title">'+esc(q2.title)+'</div>'+'<div class="quiz-meta">今日测试 · '+q2.questions.length+'道题 · 约2分钟</div>'+'<button class="btn btn-primary" onclick="startQuiz('+qi+')">开始答题</button>'+'<button class="btn btn-ghost" onclick="renderArchive()">看看我的档案馆</button></div>'; } window.scrollTo(0,0); }
function startQuiz(qi){ playState={qi:qi, i:0, answers:[]}; renderQ(); }
function renderQ(){ var qi=playState.qi, i=playState.i, q=QUIZZES[qi], qu=q.questions[i], n=q.questions.length; var h='<div class="progress">第 '+(i+1)+' / '+n+' 题</div><div class="progress-bar"><i style="width:'+Math.round((i)/n*100)+'%">'+'</i></'+'div>'; h+='<div class="card"><div class="q-prompt">'+esc(qu.p)+'</div>'; if(qu.t==="c"){ qu.o.forEach(function(o,oi){ var sel=playState.answers[i]===oi?" selected":""; h+='<button class="opt'+sel+'" onclick="pickOpt('+oi+')">'+esc(o.l)+'</button>'; }); h+='<button class="btn btn-primary"'+(playState.answers[i]===undefined?" disabled style=opacity:.4":"")+' onclick="nextQ()">'+(i===n-1?"看结果":"下一题")+'</button>'; }else{ var v=playState.answers[i]===undefined?50:playState.answers[i]; h+='<div class="scale-wrap"><div class="scale-labels"><span>'+esc(qu.min)+'</span><span>'+esc(qu.max)+'</span></div>'+'<input type="range" min="0" max="100" value="'+v+'" oninput="pickScale(this.value)"><div class="scale-val" id="sv">'+v+'</div></'+'div>'+'<button class="btn btn-primary" onclick="nextQ()">'+(i===n-1?"看结果":"下一题")+'</button>'; } h+='</'+'div>'; view.innerHTML=h; window.scrollTo(0,0); }
function pickOpt(oi){ playState.answers[playState.i]=oi; renderQ(); }
function pickScale(v){ playState.answers[playState.i]=parseInt(v,10); var el=document.getElementById("sv"); if(el) el.textContent=v; }
function nextQ(){ if(playState.answers[playState.i]===undefined) return; var q=QUIZZES[playState.qi]; if(playState.i<q.questions.length-1){ playState.i++; renderQ(); } else { var k=scoreQuiz(playState.qi, playState.answers); var labels=playState.answers.map(function(a,i){ return answerLabel(playState.qi,i,a); }); var arch=loadArch(); arch.push({qi:playState.qi, d:todayStr(), a:labels, k:k}); saveArch(arch); playState=null; renderResult(arch.length-1); } }
function renderResult(entryIdx){ var arch=loadArch(), e=arch[entryIdx], q=QUIZZES[e.qi], r=q.results[e.k]; view.innerHTML='<div class="result-card" style="--accent:'+r.c+'">'+'<div class="result-tag">'+esc(q.title)+'</div>'+'<div class="result-name">'+esc(r.n)+'</div>'+'<div class="result-blurb">'+esc(r.d)+'</div>'+'<div class="result-date">'+e.d+' · 截图分享给朋友吧</div></'+'div>'+'<button class="btn btn-primary" onclick="renderHome()">回首页</button>'+'<button class="btn btn-ghost" onclick="renderArchive()">看看我的档案馆</button>'; window.scrollTo(0,0); }
function renderArchive(){ var all=loadArch(); var h='<span class="back" onclick="renderHome()">← 回首页</span><div class="quiz-title" style="margin-bottom:14px">我的档案馆</div>'; if(!all.length){ h+='<div class="empty">还没有答过题<br>今天的测试在首页等你</div>'; } for(var ri=all.length-1; ri>=0; ri--){ (function(idx){ var e=all[idx], q=QUIZZES[e.qi], r=q.results[e.k]; var same=all.filter(function(x){return x.qi===e.qi;}).length; h+='<div class="arch-item" onclick="renderReplay('+idx+')">'+'<div class="d">'+e.d+'</div><div class="t">'+esc(q.title)+'</div>'+'<div class="r">'+esc(r.n)+'</div>'+(same>1?'<div class="n">本期共测过 '+same+' 次</div>':'')+'</div>'; })(ri); } view.innerHTML=h; window.scrollTo(0,0); }
function renderReplay(idx){ var arch=loadArch(), e=arch[idx], q=QUIZZES[e.qi], r=q.results[e.k]; var h='<span class="back" onclick="renderArchive()">← 回档案馆</span>'+'<div class="quiz-title" style="margin-bottom:4px">'+esc(q.title)+'</div>'+'<div class="quiz-meta">'+e.d+' · 结果：'+esc(r.n)+'</div>'; q.questions.forEach(function(qu,i){ h+='<div class="card replay-q"><div class="p">Q'+(i+1)+' '+esc(qu.p)+'</div>'+'<div class="replay-a">我的选择：<b>'+esc(e.a[i]||"—")+'</b></div></'+'div>'; }); h+='<div class="result-card" style="--accent:'+r.c+';margin-bottom:14px"><div class="result-name" style="font-size:20px">'+esc(r.n)+'</div><div class="result-blurb">'+esc(r.d)+'</div></'+'div>'+'<button class="btn btn-primary" onclick="startQuiz('+e.qi+')">再测一次</button>'; view.innerHTML=h; window.scrollTo(0,0); }
renderHome();
</script>
</body>
</html>
